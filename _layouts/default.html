<!doctype html>
<html lang="{{ site.lang | default: 'zh-CN' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
    <meta name="description" content="{{ site.description }}">
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="{{ '/' | relative_url }}">{{ site.title }}</a>
      <nav>
        <a href="{{ '/' | relative_url }}">Home</a>
        <a href="{{ '/about/' | relative_url }}">About</a>
        <div class="nav-dropdown">
          <a class="nav-dropdown-toggle" href="{{ '/resources/' | relative_url }}">Resources</a>
          <div class="nav-dropdown-menu">
            <a href="https://my.csu.edu.cn/" target="_blank" rel="noopener">CSU Portal</a>
            <a href="https://mail.csu.edu.cn/" target="_blank" rel="noopener">CSU Mail</a>
            <a href="https://lib.csu.edu.cn/" target="_blank" rel="noopener">CSU Library</a>
            <a href="https://pubmed.ncbi.nlm.nih.gov/" target="_blank" rel="noopener">PubMed</a>
            <a href="https://scholar.google.com/" target="_blank" rel="noopener">Google Scholar</a>
          </div>
        </div>
      </nav>
    </header>

    <main class="page">
      {{ content }}
    </main>

    <footer class="site-footer">
      <p>Built with GitHub Pages.</p>
    </footer>
  </body>
</html>
