<!doctype html>
<html lang="{{ site.lang | default: 'zh-CN' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
    <meta name="description" content="{{ site.description }}">
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="{{ '/' | relative_url }}">{{ site.title }}</a>
      <nav>
        <a href="{{ '/' | relative_url }}">Home</a>
        <a href="{{ '/about/' | relative_url }}">About</a>
        <div class="nav-dropdown">
          <button class="nav-dropdown-toggle" type="button">Resources</button>
          <div class="nav-dropdown-menu">
            <a href="{{ '/resources/' | relative_url }}">All Resources</a>
            <a href="https://my.csu.edu.cn/" target="_blank" rel="noopener">CSU Portal</a>
            <a href="https://mail.csu.edu.cn/" target="_blank" rel="noopener">CSU Mail</a>
            <a href="https://lib.csu.edu.cn/" target="_blank" rel="noopener">CSU Library</a>
            <a href="https://pubmed.ncbi.nlm.nih.gov/" target="_blank" rel="noopener">PubMed</a>
            <a href="https://pubmed.ncbi.nlm.nih.gov/?term=%28%22Genetic+Architecture%22+OR+%22Multifactorial+Inheritance%22%5BMesh%5D%29+AND+%28%22Genome-Wide+Association+Study%22%5BMesh%5D+OR+GWAS%29+AND+%28%22genetic+overlap%22+OR+%22cross-trait%22+OR+%22cross-disorder%22+OR+pleiotrop*+OR+%22genetic+correlation%22+OR+%22shared+genetic%22%29&amp;sort=date" target="_blank" rel="noopener">Genetic Architecture</a>
            <a href="https://scholar.google.com/" target="_blank" rel="noopener">Google Scholar</a>
          </div>
        </div>
      </nav>
    </header>

    <main class="page">
      {{ content }}
    </main>

    <footer class="site-footer">
      <p>Built with GitHub Pages.</p>
    </footer>
  </body>
</html>
